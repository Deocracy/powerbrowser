<!--
  D-89/D-91/D-94: the entire startup window. No custom browser chrome:
  no tab strip, toolbar, address bar, or menu. One branded loading layer
  (chrome-rendered, no network, no sidecar) painted above one remote
  <browser> element waiting for a URL. Theia's own shell is the UI.
-->
<!--
  width/height/persist are read off the ROOT element by
  xpfe/appshell/AppWindow.cpp's LoadSizeFromXUL (namespace-agnostic, so an
  <html> root works). Without them the window falls back to its 100x100 default
  and the content <browser> below ends up a 0x0 viewport: Theia still loads and
  runs, but lays out into nothing and renders as an empty window. persist makes
  a user's own resize stick across restarts, the same way browser.xhtml does.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="powerbrowser:main"
      customtitlebar="true"
      scrolling="false"
      width="1280"
      height="800"
      persist="screenX screenY width height sizemode"
      >
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:"/>
    <title>PowerBrowser</title>
    <link rel="stylesheet" href="chrome://powerbrowser/content/powerbrowser.css"/>
    <!-- Phase 37 plan 02: the stock strings the doorhanger templates name by data-l10n-id (as browser.xhtml links them). -->
    <link rel="localization" href="branding/brand.ftl"/>
    <link rel="localization" href="browser/browser.ftl"/>
    <!-- Phase 37 plan 04: the password doorhanger's field style, as popup-notifications.inc.xhtml links it. -->
    <link rel="stylesheet" href="chrome://browser/content/passwordmgr/login-doorhanger-username-field.css"/>
    <script src="chrome://powerbrowser/content/powerbrowser.js"></script>
  </head>
  <body>
    <!-- Custom title bar (see powerbrowser.js): the window buttons the OS bar
         used to carry, and the host for the drag handles laid over the
         frontend's empty top-row space. -->
    <div id="powerbrowser-window-controls">
      <button id="powerbrowser-window-minimize" type="button" tabindex="-1" title="Minimize" aria-label="Minimize"/>
      <button id="powerbrowser-window-maximize" type="button" tabindex="-1" title="Maximize" aria-label="Maximize"/>
      <button id="powerbrowser-window-close" type="button" tabindex="-1" title="Close" aria-label="Close"/>
    </div>
    <div id="powerbrowser-drag-regions"></div>
    <div id="powerbrowser-loading">PowerBrowser</div>
    <div id="powerbrowser-error">
      <p id="powerbrowser-error-message"></p>
      <div id="powerbrowser-error-controls">
        <button id="powerbrowser-error-retry" type="button">Retry</button>
        <button id="powerbrowser-error-diagnostics" type="button">Details</button>
      </div>
    </div>
    <div id="powerbrowser-diagnostics">
      <div id="powerbrowser-diagnostics-fields"></div>
      <pre id="powerbrowser-diagnostics-log"></pre>
      <button id="powerbrowser-diagnostics-close" type="button">Close</button>
    </div>
    <!-- Phase 37 (PROMPT-01): stock furniture, no custom chrome. The doorhanger
         panel verbatim from upstream/browser/base/content/popup-notifications.inc.xhtml,
         and the element it opens against, placed above the asking page by
         PowerBrowserAPI.sys.mjs. -->
    <xul:popupset id="powerbrowser-popupset">
      <xul:panel id="notification-popup"
                 type="arrow"
                 position="after_start"
                 hidden="true"
                 orient="vertical"
                 noautofocus="true"
                 role="alert"
                 remote="true"/>
      <!-- Phase 37 plan 02 (B2): the camera, microphone and screen doorhanger,
           verbatim from popup-notifications.inc.xhtml. WebRTCParent finds it by
           its id. The namespace declarations on its root let the upstream text
           parse unchanged inside this HTML document. -->
      <popupnotification xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
                         xmlns:html="http://www.w3.org/1999/xhtml"
                         xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
                         id="webRTC-shareDevices-notification" hidden="true"
                         descriptionid="webRTC-shareDevices-notification-description">
        <popupnotificationcontent id="webRTC-selectCamera" orient="vertical">
          <label id="webRTC-selectCamera-label"
                 data-l10n-id="popup-select-camera-device"
                 control="webRTC-selectCamera-menulist"/>
          <html:div class="webRTC-selectDevice-selector-container">
            <xul:image id="webRTC-selectCamera-icon" class="webRTC-selectDevice-icon" data-l10n-id="popup-select-camera-icon"/>
            <menulist id="webRTC-selectCamera-menulist" aria-labelledby="webRTC-selectCamera-icon" size="large">
              <menupopup id="webRTC-selectCamera-menupopup"/>
            </menulist>
            <label id="webRTC-selectCamera-single-device-label" class="webRTC-selectDevice-label"></label>
          </html:div>
        </popupnotificationcontent>

        <popupnotificationcontent id="webRTC-selectWindowOrScreen" orient="vertical">
          <label id="webRTC-selectWindow-label"
                 data-l10n-id="popup-select-window-or-screen"
                 control="webRTC-selectWindow-menulist"/>
          <menulist id="webRTC-selectWindow-menulist"
                    size="large">
            <menupopup id="webRTC-selectWindow-menupopup"/>
          </menulist>
          <description id="webRTC-all-windows-shared" hidden="true" data-l10n-id="popup-all-windows-shared"></description>
        </popupnotificationcontent>

        <popupnotificationcontent id="webRTC-preview-section" orient="vertical">
          <!-- <webrtc-preview> gets inserted here lazily by WebRTCParent.sys.mjs -->
          <vbox id="webRTC-previewWarningBox">
            <description id="webRTC-previewWarning"/>
            <hbox>
              <html:a id="webRTC-previewWarning-learnMore"
                      is="moz-support-link"
                      support-page="screenshare-safety"
                      class="popup-notification-learnmore-link"
            ></html:a>
            </hbox>
          </vbox>
        </popupnotificationcontent>

        <popupnotificationcontent id="webRTC-selectMicrophone" orient="vertical">
          <label id="webRTC-selectMicrophone-label"
                 data-l10n-id="popup-select-microphone-device"
                 control="webRTC-selectMicrophone-menulist"/>
          <html:div class="webRTC-selectDevice-selector-container">
            <xul:image id="webRTC-selectMicrophone-icon" data-l10n-id="popup-select-microphone-icon" class="webRTC-selectDevice-icon"/>
            <menulist id="webRTC-selectMicrophone-menulist" aria-labelledby="webRTC-selectMicrophone-icon" size="large">
              <menupopup id="webRTC-selectMicrophone-menupopup"/>
            </menulist>
            <label id="webRTC-selectMicrophone-single-device-label" class="webRTC-selectDevice-label"></label>
          </html:div>
        </popupnotificationcontent>

        <popupnotificationcontent id="webRTC-selectSpeaker" orient="vertical">
          <html:div class="webRTC-selectDevice-selector-container">
            <xul:image id="webRTC-selectSpeaker-icon" data-l10n-id="popup-select-speaker-icon" class="webRTC-selectDevice-icon"/>
            <richlistbox id="webRTC-selectSpeaker-richlistbox" aria-labelledby="webRTC-selectSpeaker-icon" size="large">
            </richlistbox>
            <label id="webRTC-selectSpeaker-single-device-label" class="webRTC-selectDevice-label"></label>
          </html:div>
        </popupnotificationcontent>
      </popupnotification>
      <!-- Phase 37 plan 04 (D-07): the password save and update doorhanger, verbatim from
           popup-notifications.inc.xhtml. LoginManagerPrompter fills these two fields and reads
           the user's edits back from them; no credential reaches Theia. -->
      <popupnotification xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
                         xmlns:html="http://www.w3.org/1999/xhtml"
                         id="password-notification" hidden="true">
        <popupnotificationcontent orient="vertical">
          <html:login-doorhanger-username-field id="password-notification-username"
                                   data-l10n-id="panel-save-update-username-2"
                                   data-l10n-attrs="label"
                                   class="login-doorhanger-field"
                                   autocompletesearch="login-doorhanger-username"
                                   autocompletepopup="PopupAutoComplete"
                                   maxrows="10"
                                   maxdropmarkerrows="10"></html:login-doorhanger-username-field>
          <html:moz-input-password id="password-notification-password"
                                   data-l10n-id="panel-save-update-password-2"
                                   data-l10n-attrs="label"
                                   class="login-doorhanger-field"/>
        </popupnotificationcontent>
      </popupnotification>
      <!-- Phase 37 plan 04: the autocomplete popup the username field names, verbatim from
           main-popupset.inc.xhtml. The prompter's "showing" callback sets its select hooks. -->
      <xul:panel is="autocomplete-richlistbox-popup"
                 type="autocomplete-richlistbox"
                 id="PopupAutoComplete"
                 role="group"
                 noautofocus="true"
                 hidden="true"
                 overflowpadding="4"
                 norolluponanchor="true"
                 nomaxresults="true"
                 locationspecific="true" />
    </xul:popupset>
    <div id="powerbrowser-notification-anchor"></div>
    <xul:browser id="powerbrowser-content" type="content" primary="true" remote="true" remoteType="web" src="about:blank" tabindex="-1"/>
  </body>
</html>
