<!doctype html><html><head><title>Snapshot fixture form</title></head><body>
<header><nav><a href="#a">Home</a> <a href="#b">Docs</a></nav></header>
<main><h1>Sign in</h1><p>Use your account.</p>
<form><label>Email <input type="email" name="e"></label>
<label><input type="checkbox"> Remember me</label>
<select aria-label="Plan"><option>Free</option><option>Pro</option></select>
<button type="submit" id="submit">Log in</button><button type="button" id="plain">Log in</button>
<div role="button" tabindex="0" id="custom">Custom</div><div onclick="1" style="cursor:pointer">Clickable div</div></form></main>
<footer><a href="#p">Privacy</a></footer>
<script>
// Fixture instrumentation, not page content: every click on a button-like element counts on that element, and the
// form never navigates, so a click on a ref'd button is observable.
document.addEventListener('click', e => { const b = e.target.closest('button, [role=button]'); if (b) b.dataset.clicks = String((+b.dataset.clicks || 0) + 1); }, true);
document.querySelector('form').addEventListener('submit', e => e.preventDefault());
// The scripted change the delta references are taken after: one new button after the custom button.
function pbChange() { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Added'; document.getElementById('custom').after(b); return 1; }
</script></body></html>
