# docs/watchdog.yml
#
# The watchdog (Phase 48, MON-01). The owner applies this file to powerbrowser-updates as
# .github/workflows/watchdog.yml at plan 48-05. It is NEVER applied to the product repository: D-77 binds
# the product repository to no schedule key. Each daily tick reads the newest run of the release-train
# workflow in the product repository. It opens one issue in this repository when that run started 26 hours
# or more ago, or when no run is recorded, and it opens nothing when an issue with the same title is open.
#
# Read credential. The read uses this repository's read-only GITHUB_TOKEN. That reads the product
# repository's runs only if the product repository is public. A private product repository needs a read
# credential from the owner; that is a BLOCKED.md item, and this file references no token or secret.
#
# The 26-hour window measures from run started_at, not conclusion: a failing run that is still running
# counts as alive.
name: Watchdog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check-train:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the newest release-train run (read only)
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "now=${NOW}" >> "$GITHUB_OUTPUT"
          gh api "repos/${OWNER}/powerbrowser/actions/workflows/release-train.yml/runs?per_page=1" --jq '.workflow_runs[0] // empty' > "$RUNNER_TEMP/latest.json"
          if [ -s "$RUNNER_TEMP/latest.json" ]; then
            STARTED=$(jq -r '.run_started_at' "$RUNNER_TEMP/latest.json")
            LINK=$(jq -r '.html_url' "$RUNNER_TEMP/latest.json")
            AGE_S=$(( ($(date -u +%s) - $(date -u -d "$STARTED" +%s)) ))
            echo "started=${STARTED}" >> "$GITHUB_OUTPUT"
            echo "link=${LINK}" >> "$GITHUB_OUTPUT"
            echo "age-seconds=${AGE_S}" >> "$GITHUB_OUTPUT"
          else
            echo "started=none" >> "$GITHUB_OUTPUT"
            echo "link=none" >> "$GITHUB_OUTPUT"
            echo "age-seconds=" >> "$GITHUB_OUTPUT"
          fi

      # 26 hours is 93600 seconds. A missing run (no age) opens the issue, naming the missing run.
      # An open issue with the same title is the dedupe: a second one is not opened.
      - name: Decide whether the train is silent (26 hours or more, or no run)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_S: ${{ steps.latest.outputs.age-seconds }}
        run: |
          set -euo pipefail
          OPEN=false
          if [ -z "$AGE_S" ] || [ "$AGE_S" -ge 93600 ]; then OPEN=true; fi
          OPEN_COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "release-train has not run in 26 h"' --json title --jq '[.[] | select(.title == "release-train has not run in 26 h")] | length')
          if [ "$OPEN_COUNT" -gt 0 ]; then OPEN=false; fi
          echo "open=${OPEN}" >> "$GITHUB_OUTPUT"

      - name: Open an issue in this repository when the train is silent
        if: ${{ steps.decide.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.latest.outputs.started }}
          LINK: ${{ steps.latest.outputs.link }}
          NOW: ${{ steps.latest.outputs.now }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/watchdog-body.md"
          if [ "$LINK" = "none" ]; then
            printf '%s\n\n%s\n%s\n' "release-train has not run in 26 h" "No release-train run is recorded in the product repository, so the train has never run or its history is gone." "Checked at: ${NOW}" > "$BODY"
          else
            printf '%s\n\n%s\n%s\n%s\n' "release-train has not run in 26 h" "Latest release-train run: ${LINK}" "Run started at: ${STARTED}" "Checked at: ${NOW}" > "$BODY"
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "release-train has not run in 26 h" --body-file "$BODY"
