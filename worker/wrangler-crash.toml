# worker/wrangler-crash.toml: the deploy descriptor for the crash-report receiver (Phase 57, TEL-07).
#
# A separate file from worker/wrangler.toml on purpose: the events Worker must not gain an R2 binding it
# does not use. No secret or token is stated here, and the Worker reads none.
#
# RUNBOOK (owner, once; the executor never runs these). Use the pinned wrangler from nixpkgs.
# wrangler never enters a flake dev shell. Record the version at each step in the operator record.
# The order is load-bearing: the zone rate-limit rule (step 5) exists BEFORE the deploy (step 7) that attaches
# the hostname, so the endpoint never takes 20 MiB writes unlimited.
#   1. Pin and record the version:    nix run nixpkgs#wrangler -- --version
#   2. Enable R2 on the account (dashboard). A payment method may be required by the free tier.
#   3. Create the bucket:             nix run nixpkgs#wrangler -- r2 bucket create powerbrowser-crash-reports
#   4. Keep the bucket private, then record that you checked each point in the operator record:
#      a. Dashboard, R2, the bucket, Settings: the r2.dev public development URL is DISABLED.
#      b. No custom domain is attached to the bucket.
#      c. The only credential that can read it is the owner's Cloudflare account; any API token you create is
#         scoped to this one bucket, read only, and its holder is named in the operator record.
#      Minidumps hold process memory (docs/CRASH-POLICY.md, Sensitivity and access); R2 encrypts at rest.
#   4b. Apply the 30-day lifecycle:   worker/crash-r2-lifecycle.json records the rule (prefix "crash/", 30 days).
#      Check the exact flag names against `nix run nixpkgs#wrangler -- r2 bucket lifecycle add --help` at
#      the pinned version, then add the one rule. The gate pins the rule's prefix and age in the descriptor.
#   5. Rate-limit rule (dashboard):   ONE zone rule, per IP, action block, whose expression matches the
#      crash hostname (the host of [urls].crash_report) with the path equal to "/submit". The zone must be on
#      the account. A rule may be created before the hostname serves traffic. The Worker keeps no counter (see
#      crash-submit.mjs), so this rule is the only rate limit. Record the threshold and the period verbatim at
#      the checkpoint. workers_dev and preview_urls are off below: a workers.dev URL would bypass the rule.
#   6. Set the hostname:              replace REPLACE-WITH-CRASH-HOSTNAME in the routes block below with the
#      crash hostname. custom_domain = true makes the deploy create the proxied DNS record and certificate for
#      it, so no separate DNS step remains; confirm the record exists in the dashboard after step 7.
#   7. Deploy:                        nix run nixpkgs#wrangler -- deploy --config worker/wrangler-crash.toml
#   8. Probe, well-formed:            a Gecko-shaped multipart POST with a minidump part named
#      upload_file_minidump answers 200 and "CrashID=<uuid>"; the record <uuid>.json holds the allowlisted
#      annotations only. Expect 200 in the operator record.
#   9. Probe, oversized:              a body over 20 MiB answers 413 "Discarded=oversized_body" with nothing stored.
#  10. Probe, burst:                  a burst over the zone rule threshold answers the rule's block, not 200.
#      Record the three responses (200, 413, blocked) in the operator record.
#
# RETENTION. The R2 lifecycle rule expires the crash/ prefix after 30 days (RETENTION_DAYS in crash-submit.mjs).
# No Worker code deletes records, so the lifecycle rule is the only retention.

name = "powerbrowser-crash-submit"
main = "crash-submit.mjs"
# Fixed past date, the same floor as worker/wrangler.toml: the Worker uses only fetch, Request, Response,
# Uint8Array, TextDecoder and the R2 binding, none of which changes behaviour with the compatibility date.
compatibility_date = "2025-01-01"

# No workers.dev URL and no preview URLs: the zone rate-limit rule (runbook step 6) does not apply to them.
workers_dev = false
preview_urls = false

# The crash hostname. custom_domain = true attaches it as a Worker custom domain (wrangler creates the proxied
# DNS record), so the zone rule of runbook step 5 applies to it. The placeholder makes an unedited deploy fail.
routes = [{ pattern = "REPLACE-WITH-CRASH-HOSTNAME", custom_domain = true }]

[[r2_buckets]]
binding = "CRASH_STORE"
bucket_name = "powerbrowser-crash-reports"
