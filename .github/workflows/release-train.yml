# The release train reconciler (Phase 43, TRAIN-01). Each run wakes, re-derives
# the state of the release from facts, makes at most one transition per release
# per run, re-renders the tracking view, and exits. Nothing is remembered between
# runs: the tracking issue is a view, never an input.
#
# Wake sources. workflow_dispatch carries the reason (tick from the scheduler
# clock, owner, or self) and the dry-run switch. The hourly clock is the start
# (the phase goal). The planned workflow_run wake on a completed Verify static
# layers run is held out pending the owner's decision (see BLOCKED.md). There is
# deliberately no schedule key here (D-77): the Worker clock dispatches this
# workflow.
#
# Jobs. derive validates the inputs and proves the pure logic on fixtures before
# anything acts. detect lists the ESR release tags under the pinned major and
# decides the ESR bump; detect-node selects and verifies the Node 24 line. The two
# halves are separate jobs, so neither blocks the other. bump calls
# rebase-upstream.yml, the one replay definition, with the candidate tag.
# bump-pr and bump-pr-node open or update chore/esr-<tag> and chore/node-v24.x in
# the bot environment, each with its own token. report owns the only issues write
# in this file.
#
# The maintenance sweep (Phase 48, TRAIN-07) runs on a dispatch tick at or past 06:00 UTC: sweep-clock
# decides the tick, maintenance-probe reads the runner count, the last watchdog run and one synthetic
# events POST under the bot environment, maintenance derives the six rows and renders the pinned
# release-train: maintenance body, and report is the only job that edits that issue (a PATCH on a byte
# diff, one comment on a transition into red, both live only). No schedule key: the clock is the Worker.
#
# Not here yet: the live GitHub facts behind derive (check runs, the Release list)
# are fixture-backed until plan 43-03 wires them, and release.yml joins the wake list
# and the release-stage states arrive with Phase 50.
#
# Dry-run. Every step that commits, opens, comments or dispatches carries a negated
# inputs.dry-run in its if:. A dry run still validates, decides and replays, because
# the replay writes nothing outside the runner.
#
# Trust. Every job carries the same-repository guard for a workflow_run wake, only
# bump-pr and bump-pr-node hold a secret, and the dispatched reason is validated first.

name: Release train

# shortcut: the dispatch takes reason and dry-run only, since the tag and release inputs were validated and then ignored, so an owner-forced bump is not possible from dispatch, upgrade when an owner-forced bump or a release-key lookup is approved and wired into detect.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the train woke: tick (the scheduler clock), owner, or self"
        required: true
        type: string
      dry-run:
        description: "Validate, decide and render; commit, open, comment and dispatch nothing"
        required: false
        type: boolean
        default: false
  # workflow_run: ['Verify static layers'] is HELD OUT. zizmor's dangerous-triggers
  # audit flags it, and the repo rule forbids suppressing that finding. The owner
  # decides whether to re-add it; see the phase BLOCKED.md. The guards below stay
  # in place so re-adding the trigger is the only change needed.

permissions: {}

# shell: bash runs every step as `bash -eo pipefail`. The default on Linux, `bash -e`, takes
# the status of the last command in a pipe, so a node failure piped into tee, sed or grep
# read as success. Every run: below inherits this.
defaults:
  run:
    shell: bash

# The author address of the commits the bot publishes. publish-bump-branch.sh treats a remote
# commit by any other author as owner work and refuses to overwrite it.
env:
  BOT_EMAIL: release-train@users.noreply.github.com

concurrency:
  group: release-train

jobs:
  derive:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.validate.outputs.reason }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the dispatched inputs
        id: validate
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          set -eu
          # A workflow_run wake carries no dispatched reason; it is a self wake.
          if [ "$EVENT" = "workflow_run" ]; then REASON=self; fi
          # A case pattern matches the whole value, not a line of it.
          case "$REASON" in
            tick|owner|self) ;;
            *) echo "release-train: FAIL -- reason must be tick, owner or self, got '$REASON'. Next step: dispatch with one of those." >&2; exit 1 ;;
          esac
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Prove the train logic on fixtures before acting
        run: node scripts/release-train.mjs --self-test

      - name: Prove the detector on fixtures before acting
        run: node scripts/detect-upstreams.mjs --self-test

  detect:
    needs: derive
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pin: ${{ steps.pin.outputs.pin }}
      candidate: ${{ steps.decide.outputs.candidate }}
      pr-open-tag: ${{ steps.decide.outputs.pr-open-tag }}
      pr-open-number: ${{ steps.decide.outputs.pr-open-number }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pin from configuration.toml
        id: pin
        run: |
          set -eu
          PIN=$(node scripts/detect-upstreams.mjs --pin)
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      # The listing is a read, so it runs in a dry run too. A dry run decides against the live
      # listing, and the would-write lines in report name the real candidate.
      - name: List the ESR release tags under the pinned major
        env:
          PIN: ${{ steps.pin.outputs.pin }}
          REMOTE: https://github.com/mozilla-firefox/firefox.git
        run: |
          set -euo pipefail
          MAJOR=$(printf '%s\n' "$PIN" | sed -n 's/^[A-Za-z]*_\([0-9]*\)_.*/\1/p')
          git ls-remote --tags --refs "$REMOTE" > "$RUNNER_TEMP/refs.txt"
          sed -n 's#.*refs/tags/##p' "$RUNNER_TEMP/refs.txt" > "$RUNNER_TEMP/names.txt"
          # grep exits 1 when no tag matches; that empty listing is a FAIL in detect-upstreams, not here.
          grep -E "^FIREFOX_${MAJOR}_[0-9]+_[0-9]+(_[0-9]+)?esr_(RELEASE|BUILD[0-9]+)$" "$RUNNER_TEMP/names.txt" > "$RUNNER_TEMP/tags.txt" || [ $? -eq 1 ]

      # Read-only: the open PRs tell the decision whether a candidate's bump PR already exists.
      # A candidate with an open PR is PR-open, so no replay runs and no branch is re-pushed.
      - name: List the open PR heads (read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/open-prs.txt"

      # product-details is advisory. An outage leaves the value empty, a NOTE is printed, and
      # the decision does not read it, so the advisory never blocks a bump.
      - name: Read the product-details advisory value
        id: advisory
        run: |
          set -eu
          if VALUE=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json \
            | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).FIREFOX_ESR))'); then
            echo "esr=$VALUE" >> "$GITHUB_OUTPUT"
          else
            echo "release-train: NOTE -- product-details is unavailable; the advisory FIREFOX_ESR value is empty and the decision does not read it." >&2
          fi

      - name: Decide the bump
        id: decide
        env:
          ADVISORY: ${{ steps.advisory.outputs.esr }}
        run: |
          set -eu
          if [ -n "$ADVISORY" ]; then
            node scripts/detect-upstreams.mjs --listing "$RUNNER_TEMP/tags.txt" --firefox-esr "$ADVISORY" --open-prs "$RUNNER_TEMP/open-prs.txt" > "$RUNNER_TEMP/decide.txt"
          else
            node scripts/detect-upstreams.mjs --listing "$RUNNER_TEMP/tags.txt" --open-prs "$RUNNER_TEMP/open-prs.txt" > "$RUNNER_TEMP/decide.txt"
          fi
          cat "$RUNNER_TEMP/decide.txt"
          grep -E '^(candidate|pr-open-tag|pr-open-number)=' "$RUNNER_TEMP/decide.txt" >> "$GITHUB_OUTPUT"

  # The Node half is its own detector job. A Node failure (index, release-keys, signature,
  # tarball) fails this job and no other: the ESR detector and the ESR bump do not need it.
  detect-node:
    needs: derive
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node-version: ${{ steps.node-index.outputs.node-version }}
      node-file: ${{ steps.node-index.outputs.node-file }}
      node-sha256: ${{ steps.node-verify.outputs.node-sha256 }}
      node-url: ${{ steps.node-verify.outputs.node-url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: List the open PR heads (read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/open-prs.txt"

      # The Node 24 line: the newest v24 entry of the release index that ships linux-x64 and is
      # strictly newer than the pin in node-runtime.json. No such line, and an open chore/node-v24.x
      # PR, are holds, and the outputs stay empty.
      - name: Select the newest Node 24 line
        id: node-index
        run: |
          set -eu
          curl -fsSL https://nodejs.org/dist/index.json -o "$RUNNER_TEMP/node-index.json"
          # The pin is passed in, so a line that is not newer than the pin holds here, before any download.
          node scripts/detect-upstreams.mjs --node-select "$RUNNER_TEMP/node-index.json" powerbrowser/packaging/node-runtime.json --open-prs "$RUNNER_TEMP/open-prs.txt" > "$RUNNER_TEMP/node-select.txt"
          cat "$RUNNER_TEMP/node-select.txt" >> "$GITHUB_OUTPUT"

      # Provenance happens here, in the job, on every bump: the SHASUMS file and its
      # signature come from nodejs.org, the signature is checked with gpgv against the
      # nodejs release-keys keyring, and the tarball sha must equal the signed entry.
      # Nothing is opened from a value this step did not verify.
      - name: Verify the Node release against its signed SHASUMS and the tarball
        id: node-verify
        if: ${{ steps.node-index.outputs.node-version != '' }}
        env:
          NODE_VERSION: ${{ steps.node-index.outputs.node-version }}
          NODE_FILE: ${{ steps.node-index.outputs.node-file }}
        run: |
          set -eu
          BASE_URL="https://nodejs.org/dist/${NODE_VERSION}"
          git clone --depth 1 https://github.com/nodejs/release-keys.git "$RUNNER_TEMP/release-keys"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          find "$RUNNER_TEMP/release-keys/keys" -name '*.asc' -exec gpg --batch --quiet --import {} +
          gpg --batch --export > "$RUNNER_TEMP/keyring.gpg"
          curl -fsSL "$BASE_URL/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
          curl -fsSL "$BASE_URL/SHASUMS256.txt.sig" -o "$RUNNER_TEMP/SHASUMS256.txt.sig"
          gpgv --keyring "$RUNNER_TEMP/keyring.gpg" "$RUNNER_TEMP/SHASUMS256.txt.sig" "$RUNNER_TEMP/SHASUMS256.txt"
          if ! node scripts/detect-upstreams.mjs --node-shasum "$RUNNER_TEMP/SHASUMS256.txt" "$NODE_FILE" > "$RUNNER_TEMP/shasum.txt"; then
            echo "release-train: FAIL -- the signed SHASUMS256.txt has no usable entry for $NODE_FILE. Next step: do not bump; check the release on nodejs.org." >&2
            exit 1
          fi
          EXPECTED=$(sed -n 's/^node-sha256=//p' "$RUNNER_TEMP/shasum.txt")
          curl -fsSL "$BASE_URL/$NODE_FILE" -o "$RUNNER_TEMP/$NODE_FILE"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/$NODE_FILE" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "release-train: FAIL -- the tarball sha256 $ACTUAL is not the signed entry $EXPECTED. Next step: do not bump; investigate the mirror." >&2
            exit 1
          fi
          echo "node-sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "node-url=$BASE_URL/$NODE_FILE" >> "$GITHUB_OUTPUT"

  bump:
    needs: [derive, detect]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) && needs.detect.outputs.candidate != '' }}
    # The replay is the one definition in rebase-upstream.yml. It writes nothing
    # outside the runner, so it runs in a dry run too; the publishing step is gated.
    uses: ./.github/workflows/rebase-upstream.yml
    with:
      tag: ${{ needs.detect.outputs.candidate }}
    permissions:
      contents: read

  bump-pr:
    needs: [derive, detect, bump]
    # Entered only on a live run whose replay succeeded. A dry run and a run with no candidate
    # never reach the bot environment, so no deployment waits for an approval for nothing.
    if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The bot environment holds the App key. The only credential this job uses is the
    # installation token minted below, and it is passed to git and gh, never printed.
    environment: bot
    permissions: {}
    steps:
      - name: Mint the bot App token
        id: app
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: powerbrowser
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repo without persisting the token (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The ESR branch replays the candidate again from the base commit, so it publishes
      # exactly the tree the bump job gated. The App-token push below is the only write.
      - name: Replay the candidate and move the pin (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        env:
          BASE: ${{ github.sha }}
          TAG: ${{ needs.detect.outputs.candidate }}
        run: |
          set -eu
          TAG_RE='^[A-Za-z]+_[0-9]+_[0-9]+(_[0-9]+)?esr_RELEASE$'
          [[ $TAG =~ $TAG_RE ]] || { echo "release-train: FAIL -- candidate '$TAG' is not an *esr_RELEASE tag. Next step: do not bump." >&2; exit 1; }
          git config user.name "release-train"
          git config user.email "$BOT_EMAIL"
          git switch -C "chore/esr-${TAG}" "$BASE"
          nix develop .#theia --command bash scripts/rebase-upstream.sh --tag "$TAG"
          cp configuration.toml "$RUNNER_TEMP/configuration.before.toml"
          sed -i "s/^firefox_esr_tag = \"[^\"]*\"/firefox_esr_tag = \"${TAG}\"/" configuration.toml
          # A sed that matched nothing would leave the pin where it was and end the run green as
          # "no PR", every tick. The pin must move, and the line must name the new tag.
          if cmp -s configuration.toml "$RUNNER_TEMP/configuration.before.toml"; then
            echo "release-train: FAIL -- the firefox_esr_tag line did not change to ${TAG}. Next step: check the line shape in configuration.toml." >&2
            exit 1
          fi
          if ! grep -qx "firefox_esr_tag = \"${TAG}\"" configuration.toml; then
            echo "release-train: FAIL -- configuration.toml does not carry firefox_esr_tag = ${TAG} after the move. Next step: do not bump; check the manifest." >&2
            exit 1
          fi
          nix develop .#theia --command node scripts/generate.mjs
          nix develop .#theia --command node scripts/verify-release-identity.mjs
          nix develop .#theia --command node scripts/verify-upstream-pins.mjs
          nix develop .#theia --command bash scripts/regenerate-patches.sh --check
          # Only the manifest, the powerbrowser tree (tracked and new files) and the patch stack
          # are staged, by explicit path. The App cannot push a commit that touches workflows.
          git add -A -- configuration.toml powerbrowser patches
          # Any change outside those paths is a replay defect, not part of the bump. Ignored paths
          # (upstream/, generated/) are not listed by git status.
          UNEXPECTED=$(git status --porcelain --untracked-files=all -- . ':(exclude)configuration.toml' ':(exclude)powerbrowser' ':(exclude)patches')
          if [ -n "$UNEXPECTED" ]; then
            echo "release-train: FAIL -- the replay changed paths outside the bump surfaces:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            echo "Next step: do not bump; find the step that wrote outside configuration.toml, powerbrowser and patches." >&2
            exit 1
          fi
          # A pathspec query, not a pipe into grep -q: under pipefail an early grep exit would read as a failed git.
          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo "release-train: FAIL -- the bump would touch a workflow file, which the bot App may not push. Next step: remove that change from the bump." >&2
            exit 1
          fi
          if git diff --cached --quiet; then echo "release-train: NOTE -- the replay of ${TAG} changed nothing to commit; no PR"; exit 0; fi
          git commit -m "chore(esr): move the Firefox ESR pin to ${TAG}" -m "Replayed through rebase-upstream.yml, the pin moved in configuration.toml and the generated surfaces regenerated. Patches are unchanged unless regenerated."

      - name: Publish chore/esr-<tag> and open or update its PR (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        env:
          BASE: ${{ github.sha }}
          TAG: ${{ needs.detect.outputs.candidate }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/esr-${TAG}"
          # The replay made no commit when HEAD is still the base: nothing to publish.
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then echo "release-train: NOTE -- no commit to publish for ${TAG}"; exit 0; fi
          # The script reads the remote branch, asks the plan, and pushes only when the plan allows it.
          bash scripts/publish-bump-branch.sh "$BRANCH" "$BASE" > "$RUNNER_TEMP/publish.txt"
          cat "$RUNNER_TEMP/publish.txt"
          if [ "$(sed -n 's/^publish=//p' "$RUNNER_TEMP/publish.txt")" = "refuse" ]; then
            echo "release-train: NOTE -- ${BRANCH} is held by the refusal above; its PR is not edited this tick"
            exit 0
          fi
          TITLE="chore(esr): move the Firefox ESR pin to ${TAG}"
          BODY="Bump to ${TAG}, replayed through rebase-upstream.yml and regenerated from configuration.toml. verify.yml runs on this PR; the owner merges."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"; else gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"; fi

  # The Node PR is its own job, with its own App token and checkout, so the ESR bump never
  # waits on it and a Node failure never reaches the ESR path.
  bump-pr-node:
    needs: [derive, detect-node]
    # Entered only on a live run where detect-node verified a Node line newer than the pin.
    if: ${{ !inputs.dry-run && needs.detect-node.result == 'success' && needs.detect-node.outputs.node-version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The bot environment holds the App key. The only credential this job uses is the
    # installation token minted below, and it is passed to git and gh, never printed.
    environment: bot
    permissions: {}
    steps:
      - name: Mint the bot App token
        id: app
        if: ${{ !inputs.dry-run && needs.detect-node.result == 'success' && needs.detect-node.outputs.node-sha256 != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: powerbrowser
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repo without persisting the token (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.detect-node.result == 'success' && needs.detect-node.outputs.node-sha256 != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Node PR is published from the base commit, so it never carries the ESR edit.
      - name: Publish chore/node-v24.x with the verified Node release (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.detect-node.result == 'success' && needs.detect-node.outputs.node-sha256 != '' }}
        env:
          BASE: ${{ github.sha }}
          NODE_VERSION: ${{ needs.detect-node.outputs.node-version }}
          NODE_URL: ${{ needs.detect-node.outputs.node-url }}
          NODE_SHA: ${{ needs.detect-node.outputs.node-sha256 }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          NODE_RE='^v24\.[0-9]+\.[0-9]+$'
          SHA_RE='^[0-9a-f]{64}$'
          [[ $NODE_VERSION =~ $NODE_RE ]] || { echo "release-train: FAIL -- Node line '$NODE_VERSION' is not on major 24. Next step: a major move is a separate decision." >&2; exit 1; }
          [[ $NODE_SHA =~ $SHA_RE ]] || { echo "release-train: FAIL -- the Node sha256 is not a 64-hex digest. Next step: do not bump." >&2; exit 1; }
          git config user.name "release-train"
          git config user.email "$BOT_EMAIL"
          git switch -C chore/node-v24.x "$BASE"
          node -e 'const fs = require("fs"); const p = "powerbrowser/packaging/node-runtime.json"; const j = JSON.parse(fs.readFileSync(p, "utf8")); j["linux-x64"] = { version: process.env.NODE_VERSION, url: process.env.NODE_URL, sha256: process.env.NODE_SHA }; fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");'
          node scripts/verify-node-major-agreement.mjs
          git add -- powerbrowser/packaging/node-runtime.json
          if git diff --cached --quiet; then echo "release-train: NOTE -- the Node pin already names $NODE_VERSION; no PR"; exit 0; fi
          git commit -m "chore(node): move the Node 24 runtime pin to ${NODE_VERSION}" -m "Version, URL and sha256 verified against the signed SHASUMS256.txt in the release train's detect-node job."
          bash scripts/publish-bump-branch.sh chore/node-v24.x "$BASE" > "$RUNNER_TEMP/publish.txt"
          cat "$RUNNER_TEMP/publish.txt"
          if [ "$(sed -n 's/^publish=//p' "$RUNNER_TEMP/publish.txt")" = "refuse" ]; then
            echo "release-train: NOTE -- chore/node-v24.x is held by the refusal above; its PR is not edited this tick"
            exit 0
          fi
          TITLE="chore(node): move the Node 24 runtime pin to ${NODE_VERSION}"
          BODY="Node 24 bump to ${NODE_VERSION}. The SHASUMS256.txt signature was checked with gpgv in the release train's detect-node job, and the tarball sha256 equals the signed entry. verify.yml runs on this PR."
          EXISTING=$(gh pr list --head chore/node-v24.x --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$EXISTING" ]; then gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"; else gh pr create --base main --head chore/node-v24.x --title "$TITLE" --body "$BODY"; fi

  # The sweep clock. No environment and no secret: it decides only whether this dispatch tick is the day's sweep
  # tick (at or past 06:00 UTC, and no accepted sweep of today). A tick that is not due ends the sweep here, so the
  # bot environment and the pinned issue are not touched.
  #
  # The previous sweep is the maintenance-state artifact of a successful run of this workflow on the repository's
  # default branch, in this repository, of the train file, on an event the train uses, with its head sha on the
  # default branch. The repository, default branch and id are read from the API, and the selection is the pure
  # selectStateArtifact: a run or artifact from a fork, a feature branch, a tag, another workflow or another
  # repository is never the previous sweep. The one lookup serves two decisions: today's sweep (this job) and the
  # previous row statuses (report). Any error or absence leaves the outputs empty, which is the fail-safe path: the
  # sweep is due and every red row is treated as newly red. A read, so no dry-run gate.
  sweep-clock:
    needs: derive
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      due: ${{ steps.due.outputs.due }}
      prev-run-id: ${{ steps.prev.outputs.run-id }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Look up the previous maintenance sweep (read)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/maint-lookup"
          mkdir -p "$OUT"
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{branch: .default_branch, repo_id: .id}' > "$OUT/repo.json" 2>/dev/null || echo '{}' > "$OUT/repo.json"
          BRANCH=$(jq -r '.branch // ""' "$OUT/repo.json")
          REPO_ID=$(jq -r '.repo_id // 0' "$OUT/repo.json")
          # 100 is the API maximum: hourly ticks leave up to 24 successful runs between two sweeps.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-train.yml/runs?branch=${BRANCH:-none}&event=workflow_dispatch&status=success&per_page=100" --jq '.workflow_runs' > "$OUT/runs.json" 2>/dev/null || echo '[]' > "$OUT/runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-train-maintenance-state&per_page=100" --jq '.artifacts' > "$OUT/artifacts.json" 2>/dev/null || echo '[]' > "$OUT/artifacts.json"
          # A run's head sha counts only when the default branch is identical to it or ahead of it (the
          # sha is an ancestor of the default branch). Any error leaves the sha out: the fail-safe.
          jq -r '.[].head_sha // empty' "$OUT/runs.json" | sort -u > "$OUT/shas.txt" || true
          : > "$OUT/verified.txt"
          while read -r SHA; do
            [ -n "$SHA" ] || continue
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${BRANCH:-none}" --jq '.status' 2>/dev/null || echo error)
            if [ "$STATUS" = "identical" ] || [ "$STATUS" = "ahead" ]; then echo "$SHA" >> "$OUT/verified.txt"; fi
          done < "$OUT/shas.txt"
          SELECTED=$(node scripts/release-train.mjs --state-select "$OUT/runs.json" "$OUT/artifacts.json" "$GITHUB_REPOSITORY" "$REPO_ID" "$BRANCH" "$OUT/verified.txt" || true)
          RUN_ID="${SELECTED%% *}"
          CREATED=""
          case "$SELECTED" in *" "*) CREATED="${SELECTED#* }" ;; esac
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "created-at=${CREATED}" >> "$GITHUB_OUTPUT"

      # A decision only, so it runs in a dry run too: the dry run renders the sweep and prints it. A dry run
      # ignores the "swept today" half, so it can be repeated after the live sweep; a live run honours it.
      - name: Decide whether this tick is the day's sweep tick
        id: due
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PREV_CREATED: ${{ steps.prev.outputs.created-at }}
        run: |
          set -eu
          LAST=""
          if [ "$DRY_RUN" != "true" ] && [ -n "$PREV_CREATED" ]; then LAST=$(date -u -d "$PREV_CREATED" +%s 2>/dev/null || true); fi
          node scripts/release-train.mjs --sweep-due "$(date -u +%s)" "$LAST" > "$RUNNER_TEMP/due.txt"
          cat "$RUNNER_TEMP/due.txt"
          grep -E '^due=(true|false)$' "$RUNNER_TEMP/due.txt" >> "$GITHUB_OUTPUT"

  # The only job that enters the bot environment in the sweep. It enters only on a live sweep tick
  # (bot-job-gate), so a dry run and a tick that is not the day's sweep never wait on an approval. Its two
  # reads are the start of the last successful scheduled watchdog run in powerbrowser-updates (App token,
  # actions read on that one repository) and one synthetic POST to the events Worker, marked synthetic and
  # authenticated with the bot copy of DOWNLOAD_COUNT_SECRET. It writes no issue. The online runner count
  # (Administration read on powerbrowser) is deferred to Phase 49, which registers the first runner: the row
  # renders no-data until then, so the grant would buy nothing yet and is not requested (BLOCKED.md item 2).
  # Every step tolerates its own failure, so one failed read marks its own row and never removes the sweep.
  maintenance-probe:
    needs: [derive, sweep-clock]
    if: ${{ !inputs.dry-run && needs.sweep-clock.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    outputs:
      watchdog-started-ms: ${{ steps.watchdog.outputs.started-ms }}
      synthetic-status: ${{ steps.synthetic.outputs.status }}
      synthetic-acked: ${{ steps.synthetic.outputs.acked }}
    steps:
      - name: Check out repo
        if: ${{ !inputs.dry-run }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # One repository, one permission: the watchdog read needs Actions read on powerbrowser-updates only.
      # A failed mint (the App lacks the grant, BLOCKED.md item 2) leaves the token empty; the read then fails
      # and the watchdog-age row renders red, and the sweep still runs.
      - name: Mint the bot App token for the watchdog read
        id: app
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: powerbrowser-updates
          permission-actions: read

      # Only a successful scheduled run counts: a watchdog that fails every day, or a manual dispatch, must not
      # keep the row green. A watchdog that has never run, or a read that fails, leaves the start empty and the
      # sweep renders a red watchdog-age row; the read error is printed to the log, not discarded.
      - name: Read the start of the last successful scheduled watchdog run (actions read, read only)
        id: watchdog
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/powerbrowser-updates/actions/workflows/watchdog.yml/runs?per_page=1&status=success&event=schedule" --jq '.workflow_runs[0].run_started_at // empty' || echo "release-train maintenance: the watchdog run read failed (see the error above)" >&2)
          if [ -n "$STARTED" ]; then
            echo "started-ms=$(date -u -d "$STARTED" +%s%3N)" >> "$GITHUB_OUTPUT"
          else
            echo "started-ms=" >> "$GITHUB_OUTPUT"
          fi

      # The bot copy of the shared secret marks this one POST synthetic, so the maintainer view excludes
      # it. The endpoint is the one configuration.toml states under [telemetry]; it must be https and the request
      # is bounded to 20 seconds. The secret goes to curl through a header file (printf is a builtin, so it is
      # never on an argv), and the response body is read only for the Worker's synthetic acknowledgement: a
      # wrong or missing secret still answers 200 (the probe is stored as a real row), so the row is green only
      # when the body is exactly "ok: stored 1 synthetic 1". The secret is never printed.
      - name: Send the synthetic events probe (bot copy of the shared secret, marked synthetic)
        id: synthetic
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          SHARED_SECRET: ${{ secrets.DOWNLOAD_COUNT_SECRET }}
        run: |
          set -euo pipefail
          ENDPOINT=$(awk '/^\[telemetry\]/ { in_block = 1; next } /^\[/ { in_block = 0 } in_block && /^endpoint = / { gsub(/"/, "", $3); print $3 }' configuration.toml)
          STATUS=000
          ACKED=false
          if [ -z "$SHARED_SECRET" ]; then
            echo "release-train maintenance: DOWNLOAD_COUNT_SECRET is empty in the bot environment; the probe is not sent" >&2
          elif [[ $ENDPOINT != https://* ]]; then
            echo "release-train maintenance: the telemetry endpoint in configuration.toml is not https; the probe is not sent" >&2
          else
            HEADERS="$RUNNER_TEMP/probe-headers"
            BODY="$RUNNER_TEMP/probe-body.txt"
            (umask 077; printf 'authorization: Bearer %s\n' "$SHARED_SECRET" > "$HEADERS")
            STATUS=$(curl -sS --max-time 20 --proto '=https' -o "$BODY" -w '%{http_code}' -X POST "$ENDPOINT" -H 'content-type: application/json' -H "@${HEADERS}" --data '{"events":[{"kind":"error","name":"release-train.maintenance-probe","data":{"type":"MaintenanceProbe","os":"unknown"},"synthetic":true,"at":0}]}' || true)
            rm -f "$HEADERS"
            if [ -f "$BODY" ] && [ "$(cat "$BODY")" = "ok: stored 1 synthetic 1" ]; then ACKED=true; fi
          fi
          echo "status=${STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "acked=${ACKED}" >> "$GITHUB_OUTPUT"

  # The sweep's render. It reads the tag listing, the commit date of each tag under the pinned major, the
  # Release list and the advisory product-details value (all reads), takes the probe outputs, derives the
  # six rows and renders the pinned body. It writes nothing; the body is handed to report base64-encoded.
  maintenance:
    needs: [derive, sweep-clock, maintenance-probe]
    # Runs on a failed probe too: a probe failure marks its own rows no-data and never removes the sweep.
    if: ${{ always() && needs.sweep-clock.outputs.due == 'true' && needs.maintenance-probe.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      body-b64: ${{ steps.render.outputs.body-b64 }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pin from configuration.toml
        id: pin
        run: |
          set -eu
          PIN=$(node scripts/detect-upstreams.mjs --pin)
          echo "pin=${PIN}" >> "$GITHUB_OUTPUT"

      - name: List the ESR release tags under the pinned major and their commit dates (read)
        env:
          PIN: ${{ steps.pin.outputs.pin }}
          REMOTE: https://github.com/mozilla-firefox/firefox.git
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAJOR=$(printf '%s\n' "$PIN" | sed -n 's/^[A-Za-z]*_\([0-9]*\)_.*/\1/p')
          git ls-remote --tags "$REMOTE" > "$RUNNER_TEMP/refs.txt"
          grep -E "^[0-9a-f]+[[:space:]]+refs/tags/FIREFOX_${MAJOR}_[0-9]+_[0-9]+(_[0-9]+)?esr_RELEASE$" "$RUNNER_TEMP/refs.txt" | sed 's#.*refs/tags/##' | sort -u > "$RUNNER_TEMP/tags.txt" || [ $? -eq 1 ]
          : > "$RUNNER_TEMP/tag-dates.tsv"
          while read -r TAG; do
            # An annotated tag names its tag object on the plain line; the commit is on the peeled ^{} line.
            SHA=$(awk -v t="refs/tags/${TAG}" '$2 == (t "^{}") { p = $1 } $2 == t { q = $1 } END { print (p != "" ? p : q) }' "$RUNNER_TEMP/refs.txt")
            DATE=$(gh api "repos/mozilla-firefox/firefox/commits/${SHA}" --jq '.commit.committer.date' 2>/dev/null || true)
            [ -n "$DATE" ] && printf '%s\t%s\n' "$TAG" "$DATE" >> "$RUNNER_TEMP/tag-dates.tsv"
          done < "$RUNNER_TEMP/tags.txt"

      - name: Read the Release list and the advisory product-details value (read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '[.[] | {tag_name, draft, prerelease}]' | jq -s 'add // []' > "$RUNNER_TEMP/releases.json"
          ADVISORY=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r '.FIREFOX_ESR // empty' || true)
          echo "$ADVISORY" > "$RUNNER_TEMP/advisory.txt"

      # The facts are built from the reads above and the probe outputs. A probe that did not run is null,
      # which the rows render as no-data; the body never carries a value the sweep did not observe.
      - name: Build the facts and render the pinned body (no writes)
        id: render
        env:
          PIN: ${{ steps.pin.outputs.pin }}
          PROBE_RESULT: ${{ needs.maintenance-probe.result }}
          PROBE_WATCHDOG_MS: ${{ needs.maintenance-probe.outputs.watchdog-started-ms }}
          PROBE_SYNTHETIC: ${{ needs.maintenance-probe.outputs.synthetic-status }}
          PROBE_ACKED: ${{ needs.maintenance-probe.outputs.synthetic-acked }}
        run: |
          set -euo pipefail
          NOW_MS=$(date -u +%s%3N)
          TAGS_JSON=$(jq -R -s 'split("\n") | map(select(. != ""))' "$RUNNER_TEMP/tags.txt")
          DATES_JSON=$(jq -R -s 'split("\n") | map(select(. != "") | split("\t") | {(.[0]): ((.[1] | fromdateiso8601) * 1000)}) | add // {}' "$RUNNER_TEMP/tag-dates.tsv")
          ADVISORY=$(cat "$RUNNER_TEMP/advisory.txt")
          jq -n \
            --arg pin "$PIN" \
            --argjson now "$NOW_MS" \
            --argjson tags "$TAGS_JSON" \
            --argjson dates "$DATES_JSON" \
            --slurpfile releases "$RUNNER_TEMP/releases.json" \
            --arg advisory "$ADVISORY" \
            --arg result "$PROBE_RESULT" \
            --arg watchdog "${PROBE_WATCHDOG_MS:-}" \
            --arg synthetic "${PROBE_SYNTHETIC:-}" \
            --arg acked "${PROBE_ACKED:-}" \
            '{
              pinTag: $pin, nowMs: $now, tags: $tags, tagDates: $dates, releases: $releases[0],
              advisoryEsr: (if $advisory == "" then null else $advisory end),
              runnersOnline: null,
              watchdogProbed: ($result == "success"),
              watchdogStartedAtMs: (if $result == "success" and $watchdog != "" then ($watchdog | tonumber) else null end),
              syntheticStatus: (if $result == "success" and $synthetic != "" then ($synthetic | tonumber) else null end),
              syntheticAcked: ($acked == "true"),
              channelOk: null,
              downloadRows: 0
            }' > "$RUNNER_TEMP/maintenance-facts.json"
          node scripts/release-train.mjs --maintenance "$RUNNER_TEMP/maintenance-facts.json" "$RUNNER_TEMP/maintenance.md"
          echo "body-b64=$(base64 -w0 "$RUNNER_TEMP/maintenance.md")" >> "$GITHUB_OUTPUT"

  report:
    needs: [derive, detect, detect-node, bump, bump-pr, bump-pr-node, sweep-clock, maintenance-probe, maintenance]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Report what this run decided
        env:
          REASON: ${{ needs.derive.outputs.reason }}
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          NODE_VERSION: ${{ needs.detect-node.outputs.node-version }}
          BUMP: ${{ needs.bump.result }}
          BUMP_PR: ${{ needs.bump-pr.result }}
          BUMP_PR_NODE: ${{ needs.bump-pr-node.result }}
        run: |
          echo "release-train: reason=${REASON} candidate=${CANDIDATE:-none} node=${NODE_VERSION:-none} bump=${BUMP} bump-pr=${BUMP_PR} bump-pr-node=${BUMP_PR_NODE}"

      # A dry run prints the branches a live run would publish, with the values this run decided.
      - name: Print the branches this run would open (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          BUMP: ${{ needs.bump.result }}
          NODE_VERSION: ${{ needs.detect-node.outputs.node-version }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "dry-run: would open or update chore/esr-${CANDIDATE} (replay result: ${BUMP})"; else echo "dry-run: no ESR bump to open"; fi
          if [ -n "$NODE_VERSION" ]; then echo "dry-run: would open or update chore/node-v24.x at ${NODE_VERSION}"; else echo "dry-run: no Node bump to open"; fi

      - name: Print the tracking issue this run would write (dry-run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "dry-run: would find or create the release-train tracking issue and render it from facts; nothing is written"

      # shortcut: the tracking issue is not written, so this step prints the would-write view (state, action and the rendered body) from this run's job outputs and exits 0, since a red run every tick is worse than an explicit, printed hold, upgrade when the live facts source and the exactly-one writer are approved (BLOCKED.md item 3).
      - name: Print the would-write view of the tracking issue (writer not wired)
        env:
          PIN: ${{ needs.detect.outputs.pin }}
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          PR_TAG: ${{ needs.detect.outputs.pr-open-tag }}
          PR_NUMBER: ${{ needs.detect.outputs.pr-open-number }}
          BUMP: ${{ needs.bump.result }}
          STAGE_OUT: ${{ needs.bump.outputs.stage }}
        run: |
          set -eu
          STAGE="$STAGE_OUT"
          if [ "$BUMP" = "failure" ] && [ -z "$STAGE" ]; then STAGE="FAIL -- the replay job ended failure with no stage line"; fi
          # A candidate whose PR is already open is the PR-open tag; the view reads it as BUMPING.
          TAG="${CANDIDATE:-$PR_TAG}"
          node scripts/release-train.mjs --would-write "$PIN" "$TAG" "$PR_NUMBER" "$STAGE"

      # The pinned maintenance issue (TRAIN-07). Found read only, by author and label on the server (a title
      # search alone returns the newest matches of any author, so strangers could push the owner's issue out of
      # the window); the JS selection is the second check. An unset or malformed OWNER_LOGIN selects nothing.
      # The write plan decides the
      # one PATCH (on a byte diff) and the one comment (on a transition into red) for this run. A tick
      # with no sweep, or a sweep that did not render, skips this block and writes nothing.
      - name: Find the pinned maintenance issue (read)
        id: maint-find
        if: ${{ needs.maintenance.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
        run: |
          set -euo pipefail
          LOGIN_RE='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          if [[ $OWNER_LOGIN =~ $LOGIN_RE ]]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --author "$OWNER_LOGIN" --label release-train --search 'in:title "release-train: maintenance"' --json number,title,body,author,labels > "$RUNNER_TEMP/maint-found.json"
          else
            echo "release-train maintenance: the repository variable OWNER_LOGIN is unset or not a login; no issue is searched or selected"
            echo '[]' > "$RUNNER_TEMP/maint-found.json"
          fi

      - name: Download the previous maintenance state (read; absent is fail-safe)
        id: maint-restore
        if: ${{ !inputs.dry-run && needs.maintenance.result == 'success' && needs.sweep-clock.outputs.prev-run-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-train-maintenance-state
          path: ${{ runner.temp }}/maint-state
          run-id: ${{ needs.sweep-clock.outputs.prev-run-id }}
          github-token: ${{ github.token }}

      - name: Plan the write for the pinned maintenance issue (read)
        id: maint-plan
        if: ${{ needs.maintenance.result == 'success' }}
        env:
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
          BODY_B64: ${{ needs.maintenance.outputs.body-b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_B64" | base64 -d > "$RUNNER_TEMP/maint-body.md"
          mkdir -p "$RUNNER_TEMP/maint-next"
          node scripts/release-train.mjs --maintenance-plan "$RUNNER_TEMP/maint-found.json" "$RUNNER_TEMP/maint-body.md" "$RUNNER_TEMP/maint-comment.md" "$RUNNER_TEMP/maint-state/state.json" "$RUNNER_TEMP/maint-next/state.json" > "$RUNNER_TEMP/maint-plan.txt"
          cat "$RUNNER_TEMP/maint-plan.txt"
          grep -E '^(action|number|patch|comment)=' "$RUNNER_TEMP/maint-plan.txt" >> "$GITHUB_OUTPUT"

      - name: Print the maintenance write this run would make (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          SWEEP_DUE: ${{ needs.sweep-clock.outputs.due }}
          MAINT_RESULT: ${{ needs.maintenance.result }}
          ACTION: ${{ steps.maint-plan.outputs.action }}
          NUMBER: ${{ steps.maint-plan.outputs.number }}
          PATCH: ${{ steps.maint-plan.outputs.patch }}
          COMMENT: ${{ steps.maint-plan.outputs.comment }}
        run: |
          if [ "$SWEEP_DUE" != "true" ]; then echo "dry-run: no maintenance sweep tick (before 06:00 UTC, or today's sweep already ran); nothing is written"; exit 0; fi
          if [ "$MAINT_RESULT" != "success" ]; then echo "dry-run: the maintenance render did not succeed (${MAINT_RESULT}); nothing is written"; exit 0; fi
          echo "dry-run: maintenance action=${ACTION} number=${NUMBER:-none} would-patch=${PATCH} would-comment=${COMMENT}; nothing is written"

      - name: Report that no pinned maintenance issue exists yet (live)
        if: ${{ !inputs.dry-run && needs.maintenance.result == 'success' && steps.maint-plan.outputs.action == 'create' }}
        run: |
          echo "release-train maintenance: no pinned maintenance issue was selected. Either the owner has not pinned it yet (plan 48-05), or the repository variable OWNER_LOGIN is unset or names another account, or the issue lacks the release-train label. Nothing is created here."

      - name: Patch the pinned maintenance issue on a byte diff (live only)
        if: ${{ !inputs.dry-run && needs.maintenance.result == 'success' && steps.maint-plan.outputs.patch == 'true' && steps.maint-plan.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.maint-plan.outputs.number }}
        run: |
          set -euo pipefail
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/maint-body.md"

      - name: Comment on the pinned maintenance issue on a transition into red (live only)
        if: ${{ !inputs.dry-run && needs.maintenance.result == 'success' && steps.maint-plan.outputs.comment == 'true' && steps.maint-plan.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.maint-plan.outputs.number }}
        run: |
          set -euo pipefail
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/maint-comment.md"

      # Live only, after the plan succeeded: the statuses this run rendered become the previous state for
      # the next sweep. A dry run stores nothing.
      - name: Save the maintenance state for the next sweep (live only)
        id: maint-save
        if: ${{ !inputs.dry-run && needs.maintenance.result == 'success' && steps.maint-plan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-train-maintenance-state
          path: ${{ runner.temp }}/maint-next/state.json
          retention-days: 90
          if-no-files-found: error
