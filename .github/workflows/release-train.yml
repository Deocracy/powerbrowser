# The release train reconciler (Phase 43, TRAIN-01). Each run wakes, re-derives
# the state of the release from facts, makes at most one transition per release
# per run, re-renders the tracking view, and exits. Nothing is remembered between
# runs: the tracking issue is a view, never an input.
#
# Wake sources. workflow_dispatch carries the reason (tick from the scheduler
# clock, owner, or self) and the dry-run switch. The hourly clock is the start
# (the phase goal). The planned workflow_run wake on a completed Verify static
# layers run is held out pending the owner's decision (see BLOCKED.md). There is
# deliberately no schedule key here (D-77): the Worker clock dispatches this
# workflow.
#
# Jobs. derive validates the inputs and proves the pure logic on fixtures before
# anything acts. detect lists the ESR release tags under the pinned major and
# decides the bump. bump calls rebase-upstream.yml, the one replay definition,
# with the candidate tag. bump-pr opens or updates chore/esr-<tag> in the bot
# environment. report owns the only issues write in this file.
#
# Not here yet: the live GitHub facts behind derive (open PRs, check runs, the
# Release list) are fixture-backed until plan 43-03 wires them, the Node 24
# detector job lands in plan 43-04, release.yml joins the wake list and the
# release-stage states arrive with Phase 50, and the maintenance sweep is Phase 48.
#
# Dry-run. Every step that commits, opens, comments or dispatches carries
# inputs.dry-run in its if: and prints what it would write instead. A dry run
# still validates, decides and replays, because the replay writes nothing outside
# the runner.
#
# Trust. Every job carries the same-repository guard for a workflow_run wake, no
# job holds a secret except bump-pr, and every dispatched value is validated first.

name: Release train

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the train woke: tick (the scheduler clock), owner, or self"
        required: true
        type: string
      dry-run:
        description: "Validate, decide and render; commit, open, comment and dispatch nothing"
        required: false
        type: boolean
        default: false
      release:
        description: "Release key v<ESR>-<revision> to act on (optional)"
        required: false
        type: string
      tag:
        description: "ESR release tag to bump to (optional; never a _BUILDn tag)"
        required: false
        type: string
  # workflow_run: ['Verify static layers'] is HELD OUT. zizmor's dangerous-triggers
  # audit flags it, and the repo rule forbids suppressing that finding. The owner
  # decides whether to re-add it; see the phase BLOCKED.md. The guards below stay
  # in place so re-adding the trigger is the only change needed.

permissions: {}

concurrency:
  group: release-train

jobs:
  derive:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.validate.outputs.reason }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the dispatched inputs
        id: validate
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
          TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          # A workflow_run wake carries no dispatched reason; it is a self wake.
          if [ "$EVENT" = "workflow_run" ]; then REASON=self; fi
          case "$REASON" in
            tick|owner|self) ;;
            *) echo "release-train: FAIL -- reason must be tick, owner or self, got '$REASON'. Next step: dispatch with one of those." >&2; exit 1 ;;
          esac
          if [ -n "$TAG" ]; then
            case "$TAG" in
              *_BUILD*) echo "release-train: FAIL -- tag '$TAG' is a _BUILDn candidate, which is never a release. Next step: dispatch an *esr_RELEASE tag." >&2; exit 1 ;;
            esac
            printf '%s\n' "$TAG" | grep -Eq '^[A-Za-z]+_[0-9]+_[0-9]+(_[0-9]+)?esr_RELEASE$' \
              || { echo "release-train: FAIL -- tag '$TAG' is not an *esr_RELEASE tag. Next step: dispatch an *esr_RELEASE tag." >&2; exit 1; }
          fi
          if [ -n "$RELEASE" ]; then
            printf '%s\n' "$RELEASE" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9]+$' \
              || { echo "release-train: FAIL -- release '$RELEASE' is not a release key v<ESR>-<revision>. Next step: dispatch the key as shown on the tracking issue." >&2; exit 1; }
            echo "release-train: NOTE -- the release key is shape-checked only; the greater-than-latest Release check lands with live Releases in Phase 50." >&2
          fi
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Prove the train logic on fixtures before acting
        run: node scripts/release-train.mjs --self-test

      - name: Prove the detector on fixtures before acting
        run: node scripts/detect-upstreams.mjs --self-test

  detect:
    needs: derive
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.decide.outputs.candidate }}
      node-version: ${{ steps.node-index.outputs.node-version }}
      node-file: ${{ steps.node-index.outputs.node-file }}
      node-sha256: ${{ steps.node-verify.outputs.node-sha256 }}
      node-url: ${{ steps.node-verify.outputs.node-url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pin from configuration.toml
        id: pin
        run: |
          echo "pin=$(node scripts/detect-upstreams.mjs --pin)" >> "$GITHUB_OUTPUT"

      # The listing is a live fetch of the upstream's tags. A dry run prints the
      # fetch it would make and lists nothing; the decision below then sees no
      # candidate and the bump is skipped, so a dry run never replays a live tag.
      - name: List the ESR release tags under the pinned major (skipped in dry-run)
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PIN: ${{ steps.pin.outputs.pin }}
          REMOTE: https://github.com/mozilla-firefox/firefox.git
        run: |
          set -eu
          MAJOR=$(printf '%s\n' "$PIN" | sed -n 's/^[A-Za-z]*_\([0-9]*\)_.*/\1/p')
          : > "$RUNNER_TEMP/tags.txt"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would run git ls-remote --tags --refs against the upstream and keep refs/tags/FIREFOX_${MAJOR}_*esr_RELEASE, deciding against pin $PIN"
            exit 0
          fi
          git ls-remote --tags --refs "$REMOTE" \
            | sed -n 's#.*refs/tags/##p' \
            | grep -E "^FIREFOX_${MAJOR}_[0-9]+_[0-9]+(_[0-9]+)?esr_(RELEASE|BUILD[0-9]+)$" > "$RUNNER_TEMP/tags.txt" || true

      - name: Read the product-details advisory value (skipped in dry-run)
        id: advisory
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would read FIREFOX_ESR from product-details (advisory only)"
            exit 0
          fi
          VALUE=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json \
            | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).FIREFOX_ESR))')
          echo "esr=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Decide the bump
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          ADVISORY: ${{ steps.advisory.outputs.esr }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would decide the bump from the listing; no candidate is carried into the replay"
            echo "candidate=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$ADVISORY" ]; then
            OUT=$(node scripts/detect-upstreams.mjs --listing "$RUNNER_TEMP/tags.txt" --firefox-esr "$ADVISORY")
          else
            OUT=$(node scripts/detect-upstreams.mjs --listing "$RUNNER_TEMP/tags.txt")
          fi
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep '^candidate=' >> "$GITHUB_OUTPUT"

      # The Node 24 line: the newest v24 entry of the release index that ships
      # linux-x64. No such line is a hold, and the outputs stay empty.
      - name: Select the newest Node 24 line (skipped in dry-run)
        id: node-index
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would select the newest v24 entry of https://nodejs.org/dist/index.json that ships linux-x64"
            exit 0
          fi
          curl -fsSL https://nodejs.org/dist/index.json -o "$RUNNER_TEMP/node-index.json"
          node scripts/detect-upstreams.mjs --node-select "$RUNNER_TEMP/node-index.json" | tee -a "$GITHUB_OUTPUT"

      # Provenance happens here, in the job, on every bump: the SHASUMS file and its
      # signature come from nodejs.org, the signature is checked with gpgv against the
      # nodejs release-keys keyring, and the tarball sha must equal the signed entry.
      # Nothing is opened from a value this step did not verify.
      - name: Verify the Node release against its signed SHASUMS and the tarball (skipped in dry-run)
        id: node-verify
        if: ${{ inputs.dry-run != true && steps.node-index.outputs.node-version != '' }}
        env:
          NODE_VERSION: ${{ steps.node-index.outputs.node-version }}
          NODE_FILE: ${{ steps.node-index.outputs.node-file }}
        run: |
          set -eu
          BASE_URL="https://nodejs.org/dist/${NODE_VERSION}"
          git clone --depth 1 https://github.com/nodejs/release-keys.git "$RUNNER_TEMP/release-keys"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          find "$RUNNER_TEMP/release-keys/keys" -name '*.asc' -exec gpg --batch --quiet --import {} +
          gpg --batch --export > "$RUNNER_TEMP/keyring.gpg"
          curl -fsSL "$BASE_URL/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
          curl -fsSL "$BASE_URL/SHASUMS256.txt.sig" -o "$RUNNER_TEMP/SHASUMS256.txt.sig"
          gpgv --keyring "$RUNNER_TEMP/keyring.gpg" "$RUNNER_TEMP/SHASUMS256.txt.sig" "$RUNNER_TEMP/SHASUMS256.txt"
          EXPECTED=$(node scripts/detect-upstreams.mjs --node-shasum "$RUNNER_TEMP/SHASUMS256.txt" "$NODE_FILE" | sed -n 's/^node-sha256=//p')
          if [ -z "$EXPECTED" ]; then
            echo "release-train: FAIL -- the signed SHASUMS256.txt carries no entry for $NODE_FILE. Next step: do not bump; check the release on nodejs.org." >&2
            exit 1
          fi
          curl -fsSL "$BASE_URL/$NODE_FILE" -o "$RUNNER_TEMP/$NODE_FILE"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/$NODE_FILE" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "release-train: FAIL -- the tarball sha256 $ACTUAL is not the signed entry $EXPECTED. Next step: do not bump; investigate the mirror." >&2
            exit 1
          fi
          echo "node-sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "node-url=$BASE_URL/$NODE_FILE" >> "$GITHUB_OUTPUT"

  bump:
    needs: [derive, detect]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) && needs.detect.outputs.candidate != '' }}
    # The replay is the one definition in rebase-upstream.yml. It writes nothing
    # outside the runner, so it runs in a dry run too; the publishing step is gated.
    uses: ./.github/workflows/rebase-upstream.yml
    with:
      tag: ${{ needs.detect.outputs.candidate }}
    permissions:
      contents: read

  bump-pr:
    needs: [derive, detect, bump]
    # always(): a skipped bump (a Node-only run) must not skip this job. Every step
    # below gates itself on the bump result or a non-empty output, so nothing publishes
    # unless a verified candidate or Node line exists.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The bot environment holds the App key. The only credential this job uses is the
    # installation token minted below, and it is passed to git and gh, never printed.
    environment: bot
    permissions: {}
    steps:
      - name: Print the branches and PRs this run would open (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          NODE_VERSION: ${{ needs.detect.outputs.node-version }}
        run: |
          echo "dry-run: would open or update chore/esr-<tag> (pin move, regenerated files, replayed patches) when a candidate exists; candidate='${CANDIDATE}'"
          echo "dry-run: would open or update chore/node-v24.x (node-runtime.json: version, url, verified sha256) when a Node line is held; node='${NODE_VERSION}'"

      - name: Mint the bot App token (skipped in dry-run)
        id: app
        if: ${{ !inputs.dry-run && (needs.bump.result == 'success' || needs.detect.outputs.node-version != '') }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: powerbrowser
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repo without persisting the token (skipped in dry-run)
        if: ${{ !inputs.dry-run && (needs.bump.result == 'success' || needs.detect.outputs.node-version != '') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Node PR is published first, from the base commit, so the ESR branch below
      # starts from the same base and never carries the Node edit.
      - name: Publish chore/node-v24.x with the verified Node release (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.detect.outputs.node-version != '' }}
        env:
          BASE: ${{ github.sha }}
          NODE_VERSION: ${{ needs.detect.outputs.node-version }}
          NODE_URL: ${{ needs.detect.outputs.node-url }}
          NODE_SHA: ${{ needs.detect.outputs.node-sha256 }}
          TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          printf '%s\n' "$NODE_VERSION" | grep -Eq '^v24\.[0-9]+\.[0-9]+$' || { echo "release-train: FAIL -- Node line '$NODE_VERSION' is not on major 24. Next step: a major move is a separate decision." >&2; exit 1; }
          printf '%s\n' "$NODE_SHA" | grep -Eq '^[0-9a-f]{64}$' || { echo "release-train: FAIL -- the Node sha256 is not a 64-hex digest. Next step: do not bump." >&2; exit 1; }
          git config user.name "release-train"
          git config user.email "release-train@users.noreply.github.com"
          git switch -C chore/node-v24.x "$BASE"
          node -e 'const fs = require("fs"); const p = "powerbrowser/packaging/node-runtime.json"; const j = JSON.parse(fs.readFileSync(p, "utf8")); j["linux-x64"] = { version: process.env.NODE_VERSION, url: process.env.NODE_URL, sha256: process.env.NODE_SHA }; fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");'
          node scripts/verify-node-major-agreement.mjs
          git add -- powerbrowser/packaging/node-runtime.json
          if git diff --cached --quiet; then echo "release-train: NOTE -- the Node pin already names $NODE_VERSION; no PR"; exit 0; fi
          git commit -m "chore(node): move the Node 24 runtime pin to ${NODE_VERSION}" -m "Version, URL and sha256 verified against the signed SHASUMS256.txt in the release train's detect job."
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # chore/node-v24.x is this job's own branch, recomputed from the base on every run.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push --force origin "HEAD:refs/heads/chore/node-v24.x"
          TITLE="chore(node): move the Node 24 runtime pin to ${NODE_VERSION}"
          BODY="Node 24 bump to ${NODE_VERSION}. The SHASUMS256.txt signature was checked with gpgv in the release train's detect job, and the tarball sha256 equals the signed entry. verify.yml runs on this PR."
          EXISTING=$(gh pr list --head chore/node-v24.x --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"; else gh pr create --base main --head chore/node-v24.x --title "$TITLE" --body "$BODY"; fi

      - name: Install Nix (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The ESR branch replays the candidate again from the base commit, so it publishes
      # exactly the tree the bump job gated. The App-token push below is the only write.
      - name: Replay the candidate and move the pin (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        env:
          BASE: ${{ github.sha }}
          TAG: ${{ needs.detect.outputs.candidate }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^[A-Za-z]+_[0-9]+_[0-9]+(_[0-9]+)?esr_RELEASE$' || { echo "release-train: FAIL -- candidate '$TAG' is not an *esr_RELEASE tag. Next step: do not bump." >&2; exit 1; }
          git config user.name "release-train"
          git config user.email "release-train@users.noreply.github.com"
          git switch -C "chore/esr-${TAG}" "$BASE"
          nix develop .#theia --command bash scripts/rebase-upstream.sh --tag "$TAG"
          sed -i "s/^firefox_esr_tag = \".*\"/firefox_esr_tag = \"${TAG}\"/" configuration.toml
          nix develop .#theia --command node scripts/generate.mjs
          nix develop .#theia --command node scripts/verify-release-identity.mjs
          nix develop .#theia --command node scripts/verify-upstream-pins.mjs
          nix develop .#theia --command bash scripts/regenerate-patches.sh --check
          # Only the manifest, the generated tracked surfaces, the version files and the
          # patch stack may be staged. The App cannot push a commit that touches workflows.
          git add -u -- configuration.toml powerbrowser patches
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "release-train: FAIL -- the bump would touch a workflow file, which the bot App may not push. Next step: remove that change from the bump." >&2
            exit 1
          fi
          if git diff --cached --quiet; then echo "release-train: NOTE -- the replay of ${TAG} changed nothing to commit; no PR"; exit 0; fi
          git commit -m "chore(esr): move the Firefox ESR pin to ${TAG}" -m "Replayed through rebase-upstream.yml, the pin moved in configuration.toml and the generated surfaces regenerated. Patches are unchanged unless regenerated."

      - name: Publish chore/esr-<tag> and open or update its PR (skipped in dry-run)
        if: ${{ !inputs.dry-run && needs.bump.result == 'success' && needs.detect.outputs.candidate != '' }}
        env:
          BASE: ${{ github.sha }}
          TAG: ${{ needs.detect.outputs.candidate }}
          TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          BRANCH="chore/esr-${TAG}"
          # The replay made no commit when HEAD is still the base: nothing to publish.
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then echo "release-train: NOTE -- no commit to publish for ${TAG}"; exit 0; fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # chore/esr-* is this job's own branch, recomputed from the base on every run.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push --force origin "HEAD:refs/heads/${BRANCH}"
          TITLE="chore(esr): move the Firefox ESR pin to ${TAG}"
          BODY="Bump to ${TAG}, replayed through rebase-upstream.yml and regenerated from configuration.toml. verify.yml runs on this PR; the owner merges."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"; else gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"; fi

  report:
    needs: [derive, detect, bump, bump-pr]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Report what this run decided
        env:
          REASON: ${{ needs.derive.outputs.reason }}
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
          BUMP: ${{ needs.bump.result }}
          BUMP_PR: ${{ needs.bump-pr.result }}
        run: |
          echo "release-train: reason=${REASON} candidate=${CANDIDATE:-none} bump=${BUMP} bump-pr=${BUMP_PR}"

      - name: Print the tracking issue this run would write (dry-run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "dry-run: would find or create the release-train tracking issue and render it from facts; nothing is written"

      # The tracking-issue writer lands in plan 43-03. A live run with a candidate
      # refuses to act rather than leave the release without its tracking view.
      - name: Refuse the live tracking-issue write until it is wired
        if: ${{ !inputs.dry-run && needs.detect.outputs.candidate != '' }}
        run: |
          echo "release-train: FAIL -- the tracking-issue writer is not wired yet (plan 43-03). Next step: dispatch with dry-run until that plan lands." >&2
          exit 1
